[package]
name = "skyflow-designer"
version = "1.0.0"
description = "SkyFlow Designer - 专业天空盒流动贴图设计工具"
authors = ["1to3fall5"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "skyflow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1.10"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "tiff", "webp"] }
base64 = "0.22"
rmp-serde = "1.3"
zstd = "0.13"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
